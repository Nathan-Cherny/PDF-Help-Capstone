<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extract Text</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      #navbar {
        display: flex;
        position: absolute;
        bottom: 0;
        width: 100%;
        z-index: 1000;
        background: white;
        padding: 20px;
        align-items: center;
        border-top: 1px solid gray;
        font-size: 15px;
        text-decoration: none;
        gap: 1%;
      }

      :root {
        --paper: #d6ecf9;
        --paper-alt: #e2e1d3;
        --card: #fbfaf5;
        --ink: #21261f;
        --ink-soft: #5b6155;
        --rule: #cfcdbb;
        --keep: #35604f;
        --keep-bg: #e7efe9;
        --reject: #ae3a28;
        --reject-bg: #f5e4e0;
        --focus: #2e5eaa;
        --radius: 3px;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--paper);
        color: var(--ink);
        font-family: "Inter", system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.45;
        overflow: hidden;
      }

      h1 {
        font-size: 21px;
        font-weight: 600;
        margin: 0;
        letter-spacing: -0.01em;
      }

      button {
        font-family: inherit;
        font-size: inherit;
      }
      button:focus-visible,
      input:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      .workspace {
        flex: 1;
        min-height: 0;
        display: flex;
        height: 100%;
        flex-direction: column;
      }

      #stats {
        background-color: white;
        border-bottom: 1px solid gray;
        max-height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        font-size: 25px;
        padding: 14px 24px;
        align-items: center;
      }

      #showAllText {
        display: flex;
        flex-direction: column;
        overflow-y: scroll;
        max-height: 85%;
      }

      #showAllText * {
        padding-left: 20px;
      }

      #showAllText div {
        display: flex;
        padding-bottom: 0px;
        padding-top: 0px;
      }

      #showAllText p {
        margin: 0;
      }

      .dropzone {
        margin: auto;
        width: 100%;
        max-width: 460px;
        border: 1.5px dashed var(--rule);
        border-radius: var(--radius);
        background: var(--card);
        padding: 56px 24px;
        text-align: center;
        transition:
          border-color 120ms ease,
          background 120ms ease;
      }
      .choose-btn {
        background: var(--ink);
        color: var(--paper);
        border: none;
        border-radius: var(--radius);
        padding: 10px 20px;
        font-weight: 500;
        cursor: pointer;
      }

      .textDataGroupHTML {
        display: flex;
        background-color: rgba(0, 0, 0, 0.25);
        flex-direction: row;
        cursor: pointer;
        border-bottom: 0.5px solid gray;
        align-items: center;
        padding-left: 15px;
      }

      .textDataGroupHTML:hover {
        background-color: rgba(0, 0, 0, 0.35);
      }

      .textDataGroupHTML .options {
        background-color: rgba(255, 255, 255, 0.5);
        margin-left: auto;
        text-align: center;
        padding: 0 !important;
        color: black !important;
      }

      .options span {
        border: 2px solid gray;
        padding: 15px 10px !important;
        text-align: center;
      }

      .options span:hover {
        border: 2px solid yellow;
      }

      input[type="file"] {
        display: none;
      }
    </style>
    <script>
      var main_text = null;
      var headers = null;
      var file = null;
      function downloadString(text, filename, mimeType) {
        // 1. Create a Blob object containing the string data
        const blob = new Blob([text], { type: mimeType });

        // 2. Create an invisible anchor (<a>) element
        const link = document.createElement("a");

        // 3. Create a temporary URL pointing to the Blob object
        link.href = URL.createObjectURL(blob);

        // 4. Set the file name for the download
        link.download = filename;

        // 5. Append the link to the DOM (required for Firefox)
        document.body.appendChild(link);

        // 6. Programmatically trigger the download
        link.click();

        // 7. Clean up by removing the link and revoking the URL
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
      }

      function intToHexColor(color) {
        return "#" + color.toString(16).padStart(6, "0");
      }

      function getMostCommonKeys(data) {
        const results = {};
        for (const key of ["color", "size"]) {
          const counts = {};
          for (const item of data[0]) {
            const value = item[key];
            counts[value] = (counts[value] || 0) + 1;
          }
          results[key] = Object.entries(counts).sort((a, b) => b[1] - a[1]);
        }
        return results;
      }

      let data = null;

      // Render the data once it has been fetched
      function show_everything() {
        if (!data || data.length === 0) return;

        // Hide the dropzone once we have data
        document.getElementById("dropzone").style.display = "none";

        const showAllText = document.getElementById("showAllText");
        showAllText.innerHTML = ""; // Clear any previous text

        let organizedTextData = {};

        for (let page of data) {
          for (let textData of page) {
            let key = `${intToHexColor(parseInt(textData["color"]))}|${textData["size"]}`;
            if (!organizedTextData[key]) {
              organizedTextData[key] = [];
            }
            organizedTextData[key].push(textData);
          }
        }

        const LIMIT = 5;
        organizedTextData = Object.fromEntries(
          Object.entries(organizedTextData).filter(
            ([key, list]) => list.length >= LIMIT,
          ),
        );

        organizedTextData = Object.fromEntries(
          Object.entries(organizedTextData).sort(
            (a, b) => b[1].length - a[1].length,
          ),
        );

        for (let textDataGroup in organizedTextData) {
          const textDataGroupHTML = document.createElement("div");
          textDataGroupHTML.id = textDataGroup;
          textDataGroupHTML.innerHTML = `${textDataGroup}`;
          textDataGroupHTML.classList.add("textDataGroupHTML");

          let options = document.createElement("div");
          options.classList.add("options");

          let makeMainText = document.createElement("span");
          makeMainText.innerHTML = "Make Main Text";
          makeMainText.style.backgroundColor = "rgb(200, 255, 255)";
          makeMainText.onclick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById("mainTextDisplay").innerHTML =
              textDataGroup;
          };

          let makeHeader = document.createElement("span");
          makeHeader.innerHTML = "Make Header";
          makeHeader.style.backgroundColor = "rgb(255, 200, 200)";
          makeHeader.onclick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById("headerDisplay").innerHTML = textDataGroup;
          };

          let download = document.createElement("span");
          download.innerHTML = "Download";
          download.onclick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            let elements = document.getElementsByClassName(textDataGroup);
            let allText = "";

            for (let element of elements) {
              allText += `${element.firstChild.innerText} `;
            }

            downloadString(allText, `${file.name.split(".")[0]}`, "text/plain");
          };

          options.appendChild(makeHeader);
          options.appendChild(makeMainText);
          // options.appendChild(download);

          textDataGroupHTML.appendChild(options);

          textDataGroupHTML.style.color = intToHexColor(
            organizedTextData[textDataGroup][0]["color"],
          );

          textDataGroupHTML.onclick = (e) => {
            let elements = document.getElementsByClassName(e.target.id);

            let ele1 = elements[0];
            if (ele1.style.display == "none") {
              var newStatus = "flex";
            } else {
              var newStatus = "none";
            }

            for (const ele of document.getElementsByClassName(e.target.id)) {
              ele.style.display = newStatus;
            }
          };

          showAllText.appendChild(textDataGroupHTML);

          for (let textData of organizedTextData[textDataGroup]) {
            const element = document.createElement("div");
            const text = document.createElement("p");
            const info = document.createElement("p");

            const hexColor = intToHexColor(textData["color"]);

            element.classList.add(textDataGroup);
            element.classList.add("textDataElement");
            element.style.fontSize = `${textData["size"]}px`;
            element.style.color = hexColor;
            element.style.backgroundColor = hexColor + "55";

            info.style.marginLeft = "auto";
            info.style.paddingRight = "25px";

            text.innerHTML = textData["text"];
            info.innerHTML = `color: ${textData["color"]}\tsize: ${textData["size"]}`;

            element.appendChild(text);
            element.appendChild(info);
            showAllText.appendChild(element);
          }
        }

        let highestKey = Object.keys(organizedTextData)[0].split("|");
        document.getElementById("stats").innerHTML = `
              <h1 style="text-align: left; width: 100%">See PDF Text Info & Extract</h1>
              <div style="display: flex;gap: 15px;flex-direction: row;width: 75%;justify-content: space-around;align-content: center;align-items: center;">
                <div style="text-align: center;
            font-size: 1rem;">
                  <h3>
                  The pairing with the highest combination is:
                  </br>
                  Color: ${highestKey[0]}</br>
                  Size: ${highestKey[1]}
                  </h3>
                  <p>
                    This means that, more than likely, the 'main content' of the PDF has this pairing.
                    </p>
                </div>
                <div>
                  <p id="mainTextDisplay">Main Text: null</p>
                  <p id="headerDisplay">Header: null</p>
                </div>
                <div style="
                    display: flex;
                    flex-direction: column;
                    justify-content: space-around;
                ">
                  <button onclick="hideAllGroupHTMLs()">Hide All</button>
                  <button onclick="showAllTop3GroupHTMLs()">Show All, Top 3</button>
                  <button onclick="showAllGroupHTMLs()">Show All</button>
                </div>
                <div>
                  <button onclick="generateResponse()">Generate Response</button>
                </div>
              </div>
              `;
      }

      function generateResponse() {
        let responses = [{ text: [""], header: "" }]; // each entry is a response - in each response is the text, a list of strings corresponding to the pages

        let header = document.getElementById("headerDisplay").innerHTML;
        let mainText = document.getElementById("mainTextDisplay").innerHTML;

        if(!header.includes("|") || !mainText.includes("|")){
          alert(`Hey man, you have to provide a header or a main text. its not gonna work otherwise`)
        }

        let responsePage = 0;

        for (let i = 0; i < data.length; i++) {
          let page = data[i];
          responses[responses.length - 1]["text"].push("");
          responsePage += 1;
          for (let line of page) {
            let code = `${intToHexColor(line["color"])}|${line["size"]}`;

            if (code == header) {
              if (
                responses[responses.length - 1]["text"].length == 1 &&
                responses[responses.length - 1]["text"][0] == ""
              ) {
                responses[responses.length - 1]["header"] += line["text"];
              } 
              else {
                responses.push({ text: [""], header: line["text"] });
                responsePage = 0;
              }
            } else if (code == mainText && responses.length > 1) {
              responses[responses.length - 1]["text"][responsePage] +=
                line["text"];
            }
          }
        }

        for(let response of responses){
          console.log(response)
          makeResponse(response.text, response.header)
        }
      }

      function makeResponse(text, header) {
        if (!text) text = [prompt("Text")];

        const template = {
          authors: [],
          institution: "",
          text: text,
          title: "",
          header: "",
          date_published: null,
          date_added: new Date(),
          start_page: 1,
        };

        downloadString(
          JSON.stringify(template, null, 4),
          `${header}.json`,
          "application/json",
        );
      }

      function hideAllGroupHTMLs() {
        let elements = document.getElementsByClassName("textDataElement");
        for (let element of elements) {
          element.style.display = "none";
        }
      }

      function showAllTop3GroupHTMLs() {
        hideAllGroupHTMLs();

        let groupDatas = document.getElementsByClassName("textDataGroupHTML");
        for (let groupData of groupDatas) {
          let textDataGroup = groupData.id;

          let top3elements = [];
          let textDataElements = document.getElementsByClassName(textDataGroup);
          for (let i = 0; i < 3; i++) {
            top3elements.push(textDataElements[i]);
          }

          for (let element of top3elements) {
            element.style.display = "flex";
          }
        }
      }

      function showAllGroupHTMLs() {
        let elements = document.getElementsByClassName("textDataElement");
        for (let element of elements) {
          element.style.display = "flex";
        }
      }

      // Setup event listeners when the page loads
      document.addEventListener("DOMContentLoaded", () => {
        const fileInput = document.getElementById("fileInput");
        const chooseBtn = document.getElementById("chooseBtn");
        const errorMsg = document.getElementById("errorMsg");

        chooseBtn.addEventListener("click", () => {
          fileInput.click();
        });

        fileInput.addEventListener("change", async (e) => {
          file = e.target.files[0];
          if (!file) return;

          // Prepare the file for sending
          const formData = new FormData();
          formData.append("file", file);

          try {
            // Send to the Flask backend
            const response = await fetch("/see_pdf_text_info", {
              method: "POST",
              body: formData,
            });

            if (response.ok) {
              data = await response.json();
              show_everything();
            } else {
              const errorData = await response.json();
              errorMsg.textContent = errorData.error || "Upload failed";
              errorMsg.removeAttribute("hidden");
            }
          } catch (err) {
            errorMsg.textContent = "Network error occurred.";
            errorMsg.removeAttribute("hidden");
            console.error(err);
          }
        });
      });
    </script>
  </head>
  <body onload="show_everything()">
    <div class="workspace">
      <div id="stats">
        <h1 style="text-align: left; width: 100%">
          See PDF Text Info & Extract
        </h1>
      </div>
      <div id="showAllText"></div>
      <div id="navbar">
        <a href="/">Home</a>
        <a href="/crop_pdf">Crop A PDF</a>
        <a href="/see_pdf_text_info">See PDF Text Info</a>
        <span
          style="
            color: black;
            margin-left: auto;
            font-size: 20px;
            cursor: pointer;
          "
          onclick="document.getElementById('navbar').style.display = 'none'"
        >
          X
        </span>
      </div>

      <section id="dropzone" class="dropzone">
        <p class="lede">Upload PDF to scan</p>
        <button class="choose-btn" id="chooseBtn">Choose a file</button>
        <input type="file" id="fileInput" accept="application/pdf" />
        <div class="error-msg" id="errorMsg" hidden=""></div>
      </section>
    </div>
  </body>
</html>
