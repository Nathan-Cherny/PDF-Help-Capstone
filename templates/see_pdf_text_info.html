<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extract Text</title>
    <style>
      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #d6ecf9;
        color: #21261f;
        font-family: system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.45;
        overflow: hidden;
      }

      h1 {
        font-size: 21px;
        font-weight: 600;
        margin: 0;
      }

      .workspace {
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* Header / controls */
      #stats {
        background: white;
        border-bottom: 1px solid gray;
        padding: 14px 24px;
      }

      #controls {
        display: flex;
        gap: 15px;
        justify-content: space-around;
        align-items: center;
        margin-top: 10px;
      }

      #controls p {
        margin: 4px 0;
      }

      .button-column {
        display: flex;
        flex-direction: column;
      }

      /* Text groups */
      #textList {
        flex: 1;
        overflow-y: auto;
        padding-bottom: 70px; /* room for the navbar */
      }

      .group-header {
        display: flex;
        align-items: center;
        padding-left: 15px;
        background: rgba(0, 0, 0, 0.25);
        border-bottom: 0.5px solid gray;
        cursor: pointer;
      }

      .group-header:hover {
        background: rgba(0, 0, 0, 0.35);
      }

      .options {
        margin-left: auto;
        display: flex;
        background: rgba(255, 255, 255, 0.5);
        color: black;
      }

      .options span {
        padding: 15px 10px;
        border: 2px solid gray;
        text-align: center;
      }

      .options span:hover {
        border-color: yellow;
      }

      .text-row {
        display: flex;
        padding-left: 20px;
      }

      .text-row p {
        margin: 0;
      }

      .text-row .info {
        margin-left: auto;
        padding-right: 25px;
      }

      /* Upload */
      .dropzone {
        margin: auto;
        width: 100%;
        max-width: 460px;
        border: 1.5px dashed #cfcdbb;
        border-radius: 3px;
        background: #fbfaf5;
        padding: 56px 24px;
        text-align: center;
      }

      .choose-btn {
        background: #21261f;
        color: #d6ecf9;
        border: none;
        border-radius: 3px;
        padding: 10px 20px;
        font-weight: 500;
        cursor: pointer;
      }

      .error-msg {
        color: #ae3a28;
        margin-top: 12px;
      }

      input[type="file"] {
        display: none;
      }

      /* Bottom nav */
      #navbar {
        position: absolute;
        bottom: 0;
        width: 100%;
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 1%;
        padding: 20px;
        background: white;
        border-top: 1px solid gray;
      }

      #navbar .close {
        margin-left: auto;
        font-size: 20px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="workspace">
      <div id="stats">
        <h1>See PDF Text Info &amp; Extract</h1>
        <div id="controls" hidden>
          <div>
            <p id="mainTextDisplay">Main Text: null</p>
            <p id="headerDisplay">Header: null</p>
          </div>
          <div class="button-column">
            <button id="hideAllBtn">Hide All</button>
            <button id="showTop3Btn">Show All, Top 3</button>
            <button id="showAllBtn">Show All</button>
          </div>
          <div>
            <button id="generateBtn">Generate Response</button>
          </div>
          <div>
            <input id="authorsInput" placeholder="authors" />
            <input id="institutionInput" placeholder="institution" />
            <input id="citationInput" placeholder="citation" />
            <input id="titleInput" placeholder="title" />
            <input id="datePublishedInput" placeholder="date_published" />
            <input id="startPageInput" type="number" placeholder="start_page" />
          </div>
        </div>
      </div>

      <div id="textList"></div>

      <div id="navbar">
        <a href="/">Home</a>
        <a href="/crop_pdf">Crop A PDF</a>
        <a href="/see_pdf_text_info">See PDF Text Info</a>
        <span class="close" id="closeNavbar">X</span>
      </div>

      <section id="dropzone" class="dropzone">
        <p>Upload PDF to scan</p>
        <button class="choose-btn" id="chooseBtn">Choose a file</button>
        <input type="file" id="fileInput" accept="application/pdf" />
        <div>
          <p>Step for text sizes</p>
          <input type="number" id="stepInput" value="1" step="any" />
        </div>
        <div class="error-msg" id="errorMsg" hidden></div>
      </section>
    </div>

    <script>
      const LIMIT = 3; // minimum number of lines for a style group to be shown

      let data = null; // array of pages, each an array of text items
      let file = null;
      let mainTextKey = null;
      let headerKey = null;

      const $ = (id) => document.getElementById(id);

      function downloadString(text, filename, mimeType) {
        const blob = new Blob([text], { type: mimeType });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        document.body.appendChild(link); // required for Firefox
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
      }

      function intToHexColor(color) {
        return "#" + Number(color).toString(16).padStart(6, "0");
      }

      function styleKey(item) {
        return `${intToHexColor(item.color)}|${item.size}`;
      }

      function fileBaseName() {
        return file.name.split(".")[0];
      }

      // ---------- Rendering ----------

      function groupByStyle() {
        const groups = {};
        for (const page of data) {
          for (const item of page) {
            (groups[styleKey(item)] ||= []).push(item);
          }
        }
        // Keep only common styles, most frequent first
        return Object.entries(groups)
          .filter(([, items]) => items.length >= LIMIT)
          .sort((a, b) => b[1].length - a[1].length);
      }

      function makeOption(label, background, onClick) {
        const span = document.createElement("span");
        span.textContent = label;
        span.style.backgroundColor = background;
        span.onclick = (e) => {
          e.stopPropagation();
          onClick();
        };
        return span;
      }

      function renderGroup(key, items, container) {
        const color = intToHexColor(items[0].color);
        const rows = [];

        const header = document.createElement("div");
        header.className = "group-header";
        header.dataset.group = key;
        header.style.color = color;
        header.append(key);

        const options = document.createElement("div");
        options.className = "options";
        options.append(
          makeOption("Make Header", "rgb(255, 200, 200)", () => {
            headerKey = key;
            $("headerDisplay").textContent = `Header: ${key}`;
          }),
          makeOption("Make Main Text", "rgb(200, 255, 255)", () => {
            mainTextKey = key;
            $("mainTextDisplay").textContent = `Main Text: ${key}`;
          }),
          makeOption("Download", "", () => {
            const text = rows.map((row) => row.dataset.text + " ").join("");
            downloadString(text, fileBaseName(), "text/plain");
          }),
        );
        header.appendChild(options);

        // Clicking a group header collapses/expands its rows
        header.onclick = () => {
          const collapsed = rows[0].style.display === "none";
          rows.forEach((row) => (row.style.display = collapsed ? "flex" : "none"));
        };

        container.appendChild(header);

        for (const item of items) {
          const row = document.createElement("div");
          row.className = "text-row";
          row.dataset.group = key;
          row.dataset.text = item.text;
          row.style.fontSize = `${item.size}px`;
          row.style.color = color;
          row.style.backgroundColor = color + "55";

          const text = document.createElement("p");
          text.textContent = item.text;

          const info = document.createElement("p");
          info.className = "info";
          info.textContent = `color: ${item.color}\tsize: ${item.size}`;

          row.append(text, info);
          container.appendChild(row);
          rows.push(row);
        }
      }

      function showEverything() {
        if (!data || data.length === 0) return;

        $("dropzone").hidden = true;
        $("controls").hidden = false;

        const container = $("textList");
        container.innerHTML = "";
        for (const [key, items] of groupByStyle()) {
          renderGroup(key, items, container);
        }
      }

      // ---------- Visibility buttons ----------

      function setRowsDisplay(display) {
        document
          .querySelectorAll(".text-row")
          .forEach((row) => (row.style.display = display));
      }

      function showTop3() {
        setRowsDisplay("none");
        const shown = {};
        document.querySelectorAll(".text-row").forEach((row) => {
          const group = row.dataset.group;
          shown[group] = (shown[group] || 0) + 1;
          if (shown[group] <= 3) row.style.display = "flex";
        });
      }

      // ---------- Response generation ----------

      function makeResponse(text, header, startPage) {
        const dateValue = $("datePublishedInput").value;
        return {
          [header]: {
            authors: JSON.parse($("authorsInput").value || "[]"),
            institution: $("institutionInput").value,
            text: text.filter(Boolean),
            citation: $("citationInput").value,
            title: $("titleInput").value,
            header,
            date_published: dateValue ? new Date(dateValue) : "",
            date_added: new Date(),
            start_page: startPage,
          },
        };
      }

      function generateResponse() {
        if (!headerKey || !mainTextKey) {
          alert("Choose a header style and a main text style first.");
          return;
        }

        let pageNumber = parseInt($("startPageInput").value) || 1;

        // Each response holds a header and a list of strings (one per page)
        const responses = [{ text: [""], header: "", start_page: pageNumber }];
        let responsePage = 0;

        for (const page of data) {
          const current = () => responses[responses.length - 1];
          current().text.push("");
          responsePage += 1;

          for (const line of page) {
            const key = styleKey(line);

            if (key === headerKey) {
              responses.push({
                text: [""],
                header: line.text,
                start_page: pageNumber,
              });
              responsePage = 0;
            } else if (key === mainTextKey && responses.length > 1) {
              current().text[responsePage] += line.text;
            }
          }
          pageNumber++;
        }

        const result = {};
        for (const r of responses) {
          Object.assign(result, makeResponse(r.text, r.header, r.start_page));
        }

        downloadString(
          JSON.stringify(result, null, 4),
          `${fileBaseName()}.json`,
          "application/json",
        );
      }

      // ---------- Upload ----------

      async function uploadFile(selectedFile) {
        const errorMsg = $("errorMsg");
        errorMsg.hidden = true;

        const formData = new FormData();
        formData.append("file", selectedFile);
        formData.append("step", $("stepInput").value);

        try {
          const response = await fetch("/see_pdf_text_info", {
            method: "POST",
            body: formData,
          });

          if (response.ok) {
            data = await response.json();
            showEverything();
          } else {
            const errorData = await response.json();
            errorMsg.textContent = errorData.error || "Upload failed";
            errorMsg.hidden = false;
          }
        } catch (err) {
          errorMsg.textContent = "Network error occurred.";
          errorMsg.hidden = false;
          console.error(err);
        }
      }

      // ---------- Setup ----------

      document.addEventListener("DOMContentLoaded", () => {
        $("chooseBtn").addEventListener("click", () => $("fileInput").click());

        $("fileInput").addEventListener("change", (e) => {
          file = e.target.files[0];
          if (file) uploadFile(file);
        });

        $("hideAllBtn").addEventListener("click", () => setRowsDisplay("none"));
        $("showTop3Btn").addEventListener("click", showTop3);
        $("showAllBtn").addEventListener("click", () => setRowsDisplay("flex"));
        $("generateBtn").addEventListener("click", generateResponse);

        $("closeNavbar").addEventListener("click", () => {
          $("navbar").style.display = "none";
        });
      });
    </script>
  </body>
</html>
